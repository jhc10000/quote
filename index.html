<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="成本核价">
<meta name="robots" content="noindex,nofollow">

<title>冷拔管成本核价系统 · 2026.11</title>
<style>
:root{
  --ink:#14212B; --ink2:#1F3341; --paper:#F7F5F0; --card:#FFFFFF;
  --amber:#B8862F; --amber-l:#E8D9B8; --line:#DCD6C8; --muted:#6C777F;
  --good:#2E7D6B; --warn:#A64B2A; --grid:#EDE9DF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
header.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#F4F1E8;
  border-bottom:3px solid var(--amber);box-shadow:0 2px 12px rgba(20,33,43,.18)}
.topin{max-width:1180px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border:1px solid var(--amber);border-radius:6px;display:grid;place-items:center;color:var(--amber);font-weight:700;font-size:16px}
h1{font-size:19px;margin:0;letter-spacing:.5px;font-weight:600}
.sub{font-size:11px;color:#A8B4BC;letter-spacing:1px;text-transform:uppercase}
.mode{margin-left:auto;display:flex;gap:0;border:1px solid #3A4C5A;border-radius:20px;overflow:hidden}
.mode button{background:transparent;color:#C9D3D9;border:0;padding:6px 14px;font-size:12.5px;cursor:pointer}
.mode button.on{background:var(--amber);color:#fff;font-weight:600}
nav{display:flex;gap:2px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 11px 10px;font-size:13px;color:#B9C4CB;text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-bottom-color:var(--amber);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:6px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:var(--ink2)}
.btn.sm{padding:4px 9px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:3px;height:15px;background:var(--amber);border-radius:2px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--grid);border-radius:8px}
/* 成本构成明细：数量列最小宽度，输入框内数字不再被裁 */
.itm th:nth-child(5),.itm td:nth-child(5){min-width:96px}
.itm input.mq{min-width:88px}
/* 汇总表里由明细统计出来的格子：可点击跳转 */
.sumlink{cursor:pointer;text-decoration:underline dotted rgba(120,120,120,.55);text-underline-offset:3px}
.sumlink:hover{color:var(--amber)}
tr.flash td{background:#FBF0CF!important;transition:background .25s}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{background:#FAF8F3;font-weight:600;color:var(--ink2);font-size:12px;position:sticky;top:0}
td.l,th.l{text-align:left}
tbody tr:hover{background:#FCFAF5}
tr.sum td{background:#FAF5E9;font-weight:600}
tr.tot td{background:var(--ink);color:#F4F1E8;font-weight:600}
td input,td select{border:1px solid transparent;background:transparent;font:inherit;text-align:right;width:100%;padding:2px 3px;border-radius:4px}
td input:focus,td select:focus{outline:none;border-color:var(--amber);background:#fff}
td input.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:linear-gradient(180deg,#FFFDF7,#FBF7EC);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.kpi .k{font-size:11px;color:var(--muted);letter-spacing:.4px}
.kpi .v{font-size:20px;font-weight:650;margin-top:2px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.dark .k{color:#A8B4BC}
.kpi.dark .v small{color:#D9C79E}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11.5px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;background:#fff;width:100%}
.note{font-size:11.5px;color:var(--muted);white-space:normal;max-width:260px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#EFEAE0;color:#5A6469}
.badge.a{background:#F6E9CE;color:#8A6415}
.badge.g{background:#E2F0EC;color:#256356}
.badge.r{background:#F8E4DA;color:#94401E}
.stack{margin:8px 0 2px}
.srow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.srow .nm{width:88px;flex:none;color:var(--ink2)}
.srow .tr{flex:1;height:14px;background:#F2EEE4;border-radius:3px;overflow:hidden;display:flex}
.srow .tr i{height:100%;display:block}
.srow .vv{width:82px;text-align:right;flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}
.legend b{width:10px;height:10px;border-radius:2px;display:block}
.warnbox{background:#FBF1E6;border:1px solid #E7CDAF;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6B4526;margin:10px 0}
.pill{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pill button{border:0;background:#fff;padding:5px 12px;font-size:12.5px;cursor:pointer}
.pill button.on{background:var(--ink);color:#fff}
footer{color:var(--muted);font-size:11.5px;text-align:center;padding:20px 0 0}
@media print{
  header.top,nav,.bar,footer,.noprint{display:none!important}
  body{background:#fff}
  .card{border:0;padding:0;margin:0 0 8px}
  .wrap{max-width:none;padding:0}
}
@media(max-width:720px){
  h1{font-size:16px}
  .topin{padding:10px 12px 0}
  .wrap{padding:0 10px 40px}
  .card{padding:12px}
  th,td{padding:5px 6px;font-size:12px}
  .kpi .v{font-size:17px}
  .specs{grid-template-columns:1fr 1fr}
  table.wide{font-size:11.5px}
  .note{max-width:none}
  /* 保留全部 11 列，改横向滚动，不再隐藏列 */
  .itm{min-width:980px}
  .itm td.n,.itm td.l{white-space:nowrap}
  .srow .nm{width:66px}
  .srow .vv{width:64px;font-size:11px}
}
</style>
</head>

/* ---- 效率查表 ---- */

}
function drawRate(od) { return num(look(S.eff.drawH, od)[1], 4); }              /* 支/小时 */

/* ---- 该规格相对 175/150/13m 的产量系数 ---- */
var REF = { od: 175, id: 150, kgm: null, len: 13 };
function refKgm() { if (!REF.kgm) REF.kgm = kgmOf(175, 150); return REF.kgm; }
function specOf(od, id, len, qty, mat) {
  return { od: od, id: id, wall: wallNom(od, id), wallBuy: wallBuy(od, id), kgm: kgmOf(od, id), len: num(len, num(P().len, 13)), qty: num(qty, 1), mat: mat };
}
function rateOf(pid, sp, mat) {
  var kgm = num(sp.kgm, refKgm()), len = num(sp.len, 13), od = num(sp.od, 175);
  var rk = refKgm();
  switch (pid) {
    case "draw": return (drawRate(od) * kgm * len) / (drawRate(REF.od) * rk * REF.len);
    case "head": return (headRate(od) * kgm * len) / (headRate(REF.od) * rk * REF.len);
    case "acid":
      var pk = acidPack(od), bt = acidBeat(mat || P().matName || "Q345B");
      return ((60 / bt) * pk * kgm * len) / ((60 / acidBeat("Q345B")) * acidPack(REF.od) * rk * REF.len);
    case "anneal": return (annealRate(mat || "Q345B") * kgm) / (annealRate("Q345B") * rk);
    case "roll": return ((60 / rollMin(wallBuy(od, num(sp.id, od - 2 * sp.wall)))) * kgm) / ((60 / rollMin(13)) * rk);
    case "straight": return ((1 / strMin(od)) * kgm) / ((1 / strMin(REF.od)) * rk);
    case "inspect": return ((60 / inspTotal(od, len)) * kgm) / ((60 / inspTotal(REF.od, REF.len)) * rk);
    case "nitrogen": return (annealRate(mat || "Q345B") * kgm) / (annealRate("Q345B") * rk);

}
/* 均摊法分母：全厂月产量 × 该规格冷拔产量系数（用户口径：C16 随规格变） */
function denomAvg(sp, mat) { return num(P().monthOut, 4300) * rateOf("draw", sp, mat); }

}

/* ---- 调整量（数量/税率 手工覆盖） ---- */
function adjOf(key, q0, tax0) {

}

/* ---- 工序明细行 ---- */
function procRows(pid, mode, mult, sp, mat) {
  mult = mult || 1; sp = sp || defaultSpec();
  var p = procById(pid);

    var tax = num(it.tax), amt0, q0, price0 = num(it.price);
    if (it.numer !== undefined && num(it.numer) !== 0) {
      if (it.gasrow) { q0 = num(it.numer) / den; amt0 = q0 * price0; }              /* 气量 m³/月 ÷ 产量 → m³/吨 */
      else { amt0 = num(it.numer) / den; q0 = price0 > 0 ? amt0 / price0 : 1; }    /* 元/月 ÷ 产量 → 元/吨 */
    } else {
      amt0 = num(it.amt); q0 = num(it.q, 1);
      if (!(price0 > 0)) price0 = q0 > 0 ? amt0 / q0 : amt0;
    }
    amt0 *= mult; q0 *= mult;

    out.push({ p: it.p, s: it.s, u: it.u, q: r4(adj.q), price: r4(price0), amt: r4(amt), tax: adj.tax, note: it.note || "", key: key });
  });

}
function defaultSpec() { return specOf(num(P().od, 175), num(P().idia, 150), P().len, 1, P().matName); }

function rowsSum(rows) {

  rows.forEach(function (r) {

    var hh = r.tax > 0 ? r.amt / (1 + r.tax) : r.amt;
    h += hh; i += r.amt - hh;
    if (String(r.p).indexOf("金属") === 0) metal += r.amt;

}

}

  if (!pr) { pid = PROCPID = S.procs[0].id; pr = procById(pid); }
  var sp = specOf(num(o.od), num(o.id), num(o.len), num(o.qty, 1), o.mat);
  var rows = procRows(pid, MODE, 1, sp, o.mat), s = rowsSum(rows);
  var q = quoteOf(rows, { w2c: num(P().w2, 1.13) });
  var kgm = sp.kgm, UF = PROCU === "m" ? kgm / 1000 : 1, perM = q.W2 * kgm / 1000;
  var m = modeOf(pid, MODE);
  var den = m === "avg" ? denomAvg(sp, o.mat) : denomPrec(pid, sp, o.mat);

  var tabs = '<div class="chips">' + S.procs.map(function (p) {
    return '<span class="chip ' + (p.id === pid ? "on" : "") + '" data-p="' + p.id + '">' + esc(p.name) + "</span>";
  }).join("") + "</div>";
  var head = tabs + '<div class="specs" style="margin-top:10px">' +
    fld("规格（φ外径/φ内径）", '<input id="pspec" class="mono" value="' + esc(specLabel(sp.od, sp.id)) + '">') +
    fld("材质", '<select id="pmat">' + Object.keys(S.routes).map(function (m) { return '<option' + (m === o.mat ? " selected" : "") + ">" + esc(m) + "</option>"; }).join("") + "</select>") +
    fld("支数", '<input id="pqty" class="mono" value="' + num(o.qty, 1) + '">') +
    fld("单支长度 m", '<input id="plen" class="mono" value="' + num(o.len) + '">') +
    fld("成品壁厚 mm", '<input id="pwall" class="mono" value="' + fm0(sp.wall, 2) + '">') +
    fld("计价米重 kg/m", '<input readonly class="mono" value="' + fm(kgm, 3) + '">') + "</div>" +
    '<div class="hint">' + modeBadge(pid, MODE) + (MODE === "avg" && isPrecDft(pid) ? ' <span class="badge g">本工序默认精算</span>' : "") + "　本工序产能 " + fm0(capLive(pid), 0) + " 吨/月 × 规格系数 " + fm(rateOf(pid, sp, o.mat), 3) + " = <b>" + fm0(den, 0) + " 吨/月</b>（即本表分母）" +
    "　·　计价壁厚 " + fm0(sp.wallBuy, 2) + " mm（含 0.5 余量）</div>";

  var body = '<div class="tw"><table class="wide itm"><thead><tr><th class="l">序号</th><th class="l">项目</th><th class="l">子项</th><th class="l">单位</th><th>数量</th><th>含税单价</th><th>含税金额</th><th>不含税</th><th>税金</th><th>税率 %</th><th class="l">备注</th></tr></thead><tbody>';
  rows.forEach(function (r, i) {
    var hh = r.tax > 0 ? r.amt / (1 + r.tax) : r.amt;
    body += '<tr><td class="l mono">' + (i + 1) + '</td><td class="l">' + esc(r.p) + '</td><td class="l">' + esc(r.s) + "</td><td class=\"l\">" + esc(r.u) + "</td>" +
      '<td class="mono"><input class="pq" data-k="' + esc(r.key) + '" value="' + fm0(r.q, 4) + '"></td>' +
      '<td class="mono">' + fm0(r.price * UF, 4) + '</td><td class="mono">' + fm(r.amt * UF) + "</td><td class=\"mono\">" + fm(hh * UF) + "</td><td class=\"mono\">" + fm((r.amt - hh) * UF) + "</td>" +
      '<td class="mono"><input class="ptax" data-k="' + esc(r.key) + '" value="' + fm0(r.tax * 100, 0) + '"></td><td class="l note">' + esc(r.note) + "</td></tr>";
  });
  body += '<tr class="sum"><td></td><td class="l">加工费用小计</td><td></td><td class="l">项</td><td></td><td></td><td class="mono">' + fm(s.g * UF) + '</td><td class="mono">' + fm(s.h * UF) + '</td><td class="mono">' + fm(s.i * UF) + "</td><td></td><td></td></tr>";
  body += '<tr class="sum"><td>※</td><td class="l">品质损失</td><td class="l">加工费 1%</td><td class="l">项</td><td></td><td></td><td class="mono">' + fm(q.qualG * UF) + '</td><td class="mono">' + fm(q.qualH * UF) + "</td><td></td><td></td><td></td></tr>";
  body += '<tr class="tot"><td>△</td><td class="l">成本合计 A</td><td></td><td class="l"></td><td></td><td></td><td class="mono">' + fm((q.g + q.qualG) * UF) + '</td><td class="mono">' + fm(q.A * UF) + '</td><td class="mono">' + fm(q.i * UF) + "</td><td></td><td></td></tr></tbody></table></div>";

  var k = '<div class="kpis">' + kpi("A 不含税成本", fm(q.A * UF), PROCU === "m" ? "元/米" : "元/吨") + kpi("X 不含税售价", fm(q.X * UF), PROCU === "m" ? "元/米" : "元/吨") +
    kpi("W1 含税", fm(q.W1 * UF), PROCU === "m" ? "元/米" : "元/吨") + kpi("W2 含税", fm(q.W2 * UF), PROCU === "m" ? "元/米" : "元/吨", "dark") +
    kpi("另：元/米 W2", fm(perM, 3), "元/m") + "</div>";
  var ubar = '<div class="card"><div class="bar" style="margin:0"><span class="pill"><button class="' + (PROCU !== "m" ? "on" : "") + '" data-pu="t">元/吨</button><button class="' + (PROCU === "m" ? "on" : "") + '" data-pu="m">元/米</button></span>' +
    '<span style="font-size:12.5px;color:var(--muted)">数量、税率可改，改完立即重算；本工序 W2 系数 ' + fm0(num(P().w2, 1.13), 2) + "</span>" +
    '<button id="pfm" style="margin-left:auto;border:1px solid ' + (isPrecDft(pid) ? "#2C6B3F" : "var(--line)") + ';background:' + (isPrecDft(pid) ? "#E8F0EA" : "#fff") + ';color:' + (isPrecDft(pid) ? "#2C6B3F" : "#14212B") + ';border-radius:6px;padding:4px 10px;font-size:12.5px;cursor:pointer">本工序默认走精算：' + (isPrecDft(pid) ? "已开" : "已关") + "</button></div></div>";

  $("#main").innerHTML = card("单工序核价 · " + pr.name, head) + k + ubar +
    card("工序成本明细（" + (PROCU === "m" ? "元/米" : "元/吨") + "）", body) +
    card("该工序成本构成", stackChart(byCat(rows), s.g + q.qualG)) +
    '<div class="hint">A=不含税成本；X=1.30A；W1=(X−1.14B)×1.2；W2=X×' + fm0(num(P().w2, 1.13), 2) + "。均摊法分母 = 全厂 " + fm0(num(P().monthOut), 0) + " × 冷拔规格系数；精算法分母 = 本工序产能 × 本工序规格系数。</div>";

  $$(".chip[data-p]").forEach(function (c) { c.onclick = function () { PROCPID = c.dataset.p; render(); }; });
  $("#pspec").onchange = function () { var pz = parseSpec(this.value); if (pz) { o.od = pz.od; o.id = pz.id; render(); } else { alert("格式 φ175/φ150"); render(); } };
  $("#pmat").onchange = function () { o.mat = this.value; render(); };
  $("#pqty").onchange = function () { o.qty = num(this.value, 1); render(); };
  $("#plen").onchange = function () { o.len = num(this.value, num(P().len)); render(); };
  $("#pwall").onchange = function () { var w = num(this.value); if (w > 0) { o.id = r2(o.od - 2 * w); render(); } };
  $$(".pq").forEach(function (i) { i.onchange = function () { setAdj(this.dataset.k, "q", num(this.value)); render(); }; });
  $$(".ptax").forEach(function (i) { i.onchange = function () { setAdj(this.dataset.k, "tax", num(this.value) / 100); render(); }; });
  $$("[data-pu]").forEach(function (b) { b.onclick = function () { PROCU = b.dataset.pu; render(); }; });
  var pfm = $("#pfm");
  if (pfm) pfm.onclick = function () { setPrecDft(pid, !isPrecDft(pid)); render(); };
}

/* ---------------- 页面：工艺路线 ---------------- */
var AB = { acid: "酸", draw: "拔", roll: "轧", anneal: "退", straight: "矫", inspect: "探", pack: "包", nitrogen: "氮", water: "水", water2: "浓水", plate: "下料", head: "车" };
function syncRouteTxt(r) { r.txt = r.steps.map(function (s) { return (AB[s[0]] || s[0]) + (num(s[1], 1) > 1 ? num(s[1]) : ""); }).join("+"); }
function pageRoute() {
  var mats = Object.keys(S.routes);
  var opts = S.procs.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + "</option>"; }).join("");
  var blocks = mats.map(function (m, mi) {
    var r = S.routes[m], steps = (r.steps || []).filter(function (s) { return s[0] !== "norm"; });
    var chips = steps.map(function (s, si) {
      var pr = procById(s[0]) || { name: s[0] };
      return '<span class="chip on" style="display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px">' + esc(pr.name) +
        ' <b class="mono">×' + num(s[1], 1) + "</b>" +
        '<button class="btn sm rstep" data-m="' + mi + '" data-i="' + si + '" data-d="1" style="padding:1px 5px">+</button>' +
        '<button class="btn sm rstep" data-m="' + mi + '" data-i="' + si + '" data-d="-1" style="padding:1px 5px">−</button>' +
        '<button class="btn sm rdel" data-m="' + mi + '" data-i="' + si + '" style="padding:1px 5px">×</button></span>';
    }).join(" ");
    if (r.norm) chips += ' <span class="chip on" style="padding:4px 10px">正火 ×1.8（气/电）</span>';
    var sp = specOf(175, 150, num(P().len), 1, m), q = mainQuote(m, sp);
    return '<div class="card"><h2>' + esc(m) + " · " + esc(r.label || "") + "</h2>" +
      '<div class="hint">路线串：<b>' + esc(r.txt || "") + "</b>　（×N = 重复该工序 N 次）</div>" +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 12px">' + (chips || '<span class="hint">空</span>') + "</div>" +
      '<div class="bar" style="margin:0"><select class="radd" data-m="' + mi + '" style="border:1px solid var(--line);border-radius:6px;padding:6px 9px"><option value="">选择要追加的工序</option>' + opts + "</select>" +
      '<button class="btn sm raddok" data-m="' + mi + '">追加</button>' +
      '<button class="btn sm rnorm" data-m="' + mi + '">' + (r.norm ? "取消正火" : "设为正火") + "</button>" +
      '<button class="btn sm rdelm" data-m="' + mi + '">删除该代号</button>' +
      '<span style="margin-left:auto;font-size:12.5px;color:var(--muted)">φ175/φ150 试算：A ' + fm(q.A) + " · X " + fm(q.X) + " · W2 " + fm(q.W2) + " 元/吨</span></div></div>";
  }).join("");
  $("#main").innerHTML = '<div class="bar"><button class="btn" id="newmat">新增材质代号</button><span style="font-size:13px;color:var(--muted)">每个代号一条预设路线，产品在模版页选「材质/供货状态」即套用；新增代号可复制现有路线再改。</span></div>' + blocks;
  $$(".rstep").forEach(function (b) {
    b.onclick = function () {
      var r = S.routes[mats[num(this.dataset.m)]], i = num(this.dataset.i), d = num(this.dataset.d);
      r.steps[i][1] = Math.max(1, num(r.steps[i][1], 1) + d); syncRouteTxt(r); save(); render();
    };
  });
  $$(".rdel").forEach(function (b) { b.onclick = function () { var r = S.routes[mats[num(this.dataset.m)]]; r.steps.splice(num(this.dataset.i), 1); syncRouteTxt(r); save(); render(); }; });
  $$(".raddok").forEach(function (b) {
    b.onclick = function () {
      var r = S.routes[mats[num(this.dataset.m)]];
      var sel = $$(".radd").filter(function (x) { return x.dataset.m === b.dataset.m; })[0];
      if (!sel || !sel.value) return;
      r.steps.push([sel.value, 1]); syncRouteTxt(r); save(); render();
    };
  });
  $$(".rnorm").forEach(function (b) { b.onclick = function () { var r = S.routes[mats[num(this.dataset.m)]]; r.norm = r.norm ? null : 1; save(); render(); }; });
  $$(".rdelm").forEach(function (b) {
    b.onclick = function () {
      var m = mats[num(this.dataset.m)];
      if (Object.keys(S.routes).length <= 1) { alert("至少保留一个代号"); return; }
      if (!confirm("删除代号 " + m + "？产品库中该材质将被改到第一个代号。")) return;
      delete S.routes[m];
      var first = Object.keys(S.routes)[0];
      S.prod.forEach(function (x) { if (x.mat === m) x.mat = first; });
      save(); render();
    };
  });
  $("#newmat").onclick = function () {
    var nm = prompt("新代号名称（如 42CrMo）", "");
    if (!nm) return;
    nm = nm.trim(); if (S.routes[nm]) { alert("代号已存在"); return; }
    var cp = prompt("复制哪条现有路线？填代号", Object.keys(S.routes)[0]);
    var src = S.routes[cp] || S.routes[Object.keys(S.routes)[0]];
    S.routes[nm] = { label: nm, steps: deep(src.steps), norm: src.norm || null, txt: src.txt };
    syncRouteTxt(S.routes[nm]);
    save(); render();
  };
}

  var gasTbl = '<div class="tw"><table><thead><tr><th class="l">气源</th><th>月气量 m³（可改）</th><th>占比</th><th>月金额 元</th><th>元/吨</th></tr></thead><tbody>' +
    '<tr><td class="l">退火炉（含正火基准）</td><td><input class="mono gg" data-k="gasFurn" value="' + fm0(p.gasFurn, 0) + '"></td><td class="mono">' + fm(p.gasFurn / (p.gasFurn + p.gasAcid) * 100, 1) + '%</td><td class="mono">' + fm0(p.gasFurn * p.gas, 0) + '</td><td class="mono">' + fm(p.gasFurnT, 2) + '</td></tr>' +
    '<tr><td class="l">酸洗锅炉</td><td><input class="mono gg" data-k="gasAcid" value="' + fm0(p.gasAcid, 0) + '"></td><td class="mono">' + fm(p.gasAcid / (p.gasFurn + p.gasAcid) * 100, 1) + '%</td><td class="mono">' + fm0(p.gasAcid * p.gas, 0) + '</td><td class="mono">' + fm(p.gasAcidT, 2) + '</td></tr>' +
    '<tr class="sum"><td class="l">合计</td><td class="mono">' + fm0(p.gasFurn + p.gasAcid, 0) + "</td><td></td><td class=\"mono\">" + fm0((p.gasFurn + p.gasAcid) * p.gas, 0) + '</td><td class="mono">' + fm(p.gasFurnT + p.gasAcidT, 2) + "</td></tr></tbody></table></div>";
  var k = '<div class="kpis">' + kpi("全厂制造成本", fm(p.total), "元/吨") + kpi("全厂月产量（基准）", fm0(p.monthOut, 0), "吨") + kpi("年产量", fm0(p.yearOut, 0), "吨", "dark") + "</div>";
  var modeChips = S.procs.map(function (pr) {
    var on = isPrecDft(pr.id) || MODE === "prec", m = modeOf(pr.id, MODE);
    return '<span class="chip ' + (on ? "on" : "") + '" data-md="' + pr.id + '" title="点击切换该工序的默认分母">' + esc(pr.name) +
      ' <b class="mono" style="font-weight:600">' + (m === "prec" ? "精算 " + fm0(capLive(pr.id), 0) + " t" : "均摊 " + fm0(denomAvg(defaultSpec(), P().matName), 0) + " t") + "</b></span>";

      setPrecDft(c.dataset.md, !isPrecDft(c.dataset.md)); render();

    i.onchange = function () {
      var k = this.dataset.k, v = num(this.value); P()[k] = v;

    };
  });
}



/* ---------------- 页面：设备分摊 ---------------- */
function pageDev() {
  var p = P();
  var groups = {};
  S.dev.forEach(function (d) {
    var g = blkOf(d) || "其他";
    if (!groups[g]) groups[g] = { n: 0, s: 0, w: 0, aa: 0, af: 0, cap: 0 };
    var o = groups[g];
    o.n++; o.s += num(d.wage); o.w += num(d.kwh); o.aa += num(d.depr); o.af += num(d.pdepr); o.cap += num(d.cap);
  });
  var gsum = Object.keys(groups).map(function (k) { return { k: k, v: groups[k] }; }).sort(function (a, b) { return b.v.cap - a.v.cap; });
  var body = '<div class="tw" style="max-height:380px;overflow-y:auto"><table class="wide"><thead><tr><th class="l">工序</th><th>设备数</th><th>月产能 吨</th><th>工资 元/月</th><th>电费 元/月</th><th>设备折旧</th><th>厂房折旧</th><th>人工 元/吨</th><th>电 元/吨</th><th>设备折/吨</th><th>厂房折/吨</th><th>四项合计 元/吨</th></tr></thead><tbody>';
  gsum.forEach(function (x) {

  var body = '<div class="tw"><table class="wide"><thead><tr><th class="l">工序 / 项目</th>' + rows.map(function (r) { return "<th>" + r.nm + "</th>"; }).join("") + "<th>运输</th><th>环保</th><th>管理费 6%</th><th>合计</th></tr></thead><tbody>";
  body += '<tr><td class="l">未税 A</td>' + rows.map(function (r) { return '<td class="mono">' + fm(r.A) + "</td>"; }).join("") + '<td class="mono">' + fm(p.transp) + '</td><td class="mono">' + fm(p.env) + '</td><td class="mono">' + fm(mgmtA) + '</td><td class="mono"><b>' + fm(sumA + mgmtA) + "</b></td></tr>";
  body += '<tr><td class="l">含税成本（×1.13）</td>' + rows.map(function (r) { return '<td class="mono">' + fm(r.H1) + "</td>"; }).join("") + '<td class="mono">' + fm(p.transp * 1.13) + '</td><td class="mono">' + fm(p.env * 1.13) + '</td><td class="mono">' + fm(mgmt1) + '</td><td class="mono"><b>' + fm(H1 + mgmt1) + "</b></td></tr>";
  body += '<tr><td class="l">含税售价（×' + fm0(W2C, 2) + '）</td>' + rows.map(function (r) { return '<td class="mono">' + fm(r.H2) + "</td>"; }).join("") + '<td class="mono">' + fm(p.transp * W2C) + '</td><td class="mono">' + fm(p.env * W2C) + '</td><td class="mono">' + fm(mgmt2) + '</td><td class="mono"><b>' + fm(H2 + mgmt2) + "</b></td></tr>";
  body += "</tbody></table></div>";
  var perM = (sumA + mgmtA) * sp.kgm / 1000;
  $("#main").innerHTML = card("缸筒对外报价 · 短件汇总（元/吨）", head + body) +
    '<div class="kpis">' + kpi("未税合计", fm(sumA + mgmtA), "元/吨", "dark") + kpi("含税成本", fm(H1 + mgmt1), "元/吨") + kpi("含税售价", fm(H2 + mgmt2), "元/吨") + kpi("未税 元/米", fm(perM, 3), "元/m") + kpi("单支金额", fm(perM * sp.len, 2), "元/支") + "</div>";
  $("#cspec").onchange = function () { var pz = parseSpec(this.value); if (pz) { o.od = pz.od; o.id = pz.id; render(); } else { alert("格式 φ175/φ150"); render(); } };
  $("#cmat").onchange = function () { o.mat = this.value; render(); };
  $("#cqty").onchange = function () { o.qty = num(this.value, 1); render(); };
  $("#clen").onchange = function () { o.len = num(this.value, P().len); render(); };
  $("#cwall").onchange = function () { var w = num(this.value); if (w > 0) { o.id = r2(o.od - 2 * w); render(); } };
}

/* ---------------- 页面：汇总清单 ---------------- */
function pageSum() {
  var mats = Object.keys(S.routes), body = '<div class="tw"><table><thead><tr><th class="l">材质 / 供货状态</th><th class="l">工艺路线</th><th>产品数</th><th>总米数</th><th>总重量 t</th><th>X 不含税</th><th>W2 含税</th><th>均价 元/米</th></tr></thead><tbody>';
  mats.forEach(function (m) {
    var rr = S.prod.filter(function (x) { return x.mat === m; }), om = 0, ot = 0, pm = 0;
    rr.forEach(function (x) {
      var sp = specOf(x.od, x.id, num(x.len, P().len), num(x.qty, 1), m), q = mainQuote(m, sp);
      om += num(x.qty, 1) * num(x.len, P().len); ot += num(x.qty, 1) * num(x.len, P().len) * sp.kgm / 1000; pm += q.W2 * sp.kgm / 1000;
    });
    var sp0 = specOf(175, 150, num(P().len), 1, m), q0 = mainQuote(m, sp0);
    body += '<tr><td class="l"><b>' + esc(m) + '</b><br><span style="font-size:11.5px;color:var(--muted)">' + esc(routeOf(m).label) + '</span></td><td class="l" style="font-size:12px;color:var(--muted)">' + esc(routeOf(m).txt) + '</td>' +
      '<td class="mono">' + rr.length + '</td><td class="mono">' + fm0(om, 0) + '</td><td class="mono">' + fm(ot, 3) + '</td><td class="mono">' + fm(q0.X) + '</td><td class="mono"><b>' + fm(q0.W2) + '</b></td><td class="mono">' + fm(rr.length ? pm / rr.length : 0, 3) + "</td></tr>";
  });
  body += "</tbody></table></div>";
  var procs = '<div class="tw"><table><thead><tr><th class="l">工序</th><th>产能 吨/月</th><th>A 成本</th><th>X 不含税</th><th>W1 含税</th><th>W2 含税</th><th>口径</th><th>该规格产量</th><th class="l">用于材质</th></tr></thead><tbody>';
  S.procs.forEach(function (p) {
    var mp = modeOf(p.id, MODE);
    var q = procQuote(p.id, MODE, defaultSpec(), P().matName), den = mp === "avg" ? denomAvg(defaultSpec(), P().matName) : denomPrec(p.id, defaultSpec(), P().matName);
    var used = Object.keys(S.routes).filter(function (m) { return hasProc(m, p.id); });
    procs += '<tr><td class="l">' + esc(p.name) + '</td><td class="mono">' + fm0(capLive(p.id), 0) + '</td><td class="mono">' + fm(q.A) + '</td><td class="mono">' + fm(q.X) + '</td><td class="mono">' + fm(q.W1) + '</td><td class="mono"><b>' + fm(q.W2) + '</b></td><td>' + modeBadge(p.id, MODE) + '</td><td class="mono">' + fm0(den, 0) + '</td><td class="l" style="font-size:12px">' + esc(used.join(" / ")) + "</td></tr>";
  });
  procs += "</tbody></table></div>";
  $("#main").innerHTML = card("材质汇总（按 " + modeTxt() + "）", body) + card("单工序汇总", procs) +
    '<div class="bar"><button class="btn" id="expAll">导出全部报价 CSV</button><button class="btn" onclick="window.print()">打印</button></div>' +
    '<div class="hint">A=不含税成本；X=1.30A；W1=(X−1.14B)×1.2；W2=X×1.13（全站统一，可在全局数据页改）；吨价按该规格月产量算，因此同材质不同规格价格不同。</div>';
  $("#expAll").onclick = function () {
    var lines = ["材质,规格,米重kg/m,支数,单支长m,总米数,总重量t,X,元/米,W2,元/米"];
    S.prod.forEach(function (x) {
      var sp = specOf(x.od, x.id, num(x.len, P().len), num(x.qty, 1), x.mat), q = mainQuote(x.mat, sp);
      lines.push([x.mat, x.spec, r2(sp.kgm), num(x.qty, 1), num(x.len, P().len), r2(num(x.qty, 1) * num(x.len, P().len)), r4(num(x.qty, 1) * num(x.len, P().len) * sp.kgm / 1000), r2(q.X), r4(q.X * sp.kgm / 1000), r2(q.W2), r4(q.W2 * sp.kgm / 1000)].join(","));
    });
    dl("全部产品报价.csv", lines.join("\n"));
  };
}

/* ---------------- 页面：成本构成 ---------------- */
function pageChart() {
  var h = card("各工序成本构成（" + (MODE === "avg" ? "均摊" + (isPrecDft("head") ? "·车头精算" : "") : "精算") + "，元/吨）",
    S.procs.map(function (p) {
      var rows = procRows(p.id, MODE, 1, defaultSpec(), P().matName), s = rowsSum(rows);
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:2px"><b>' + esc(p.name) + '</b><span class="mono">' + fm(s.g) + " 元/吨</span></div>" + stackChart(byCat(rows), s.g) + "</div>";
    }).join(""));
  var mats = Object.keys(S.routes).map(function (m) {
    var sp = specOf(175, 150, num(P().len), 1, m), rows = mainRows(m, sp), s = rowsSum(rows), q = mainQuote(m, sp);
    return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:2px"><b>' + esc(m) + '</b><span class="mono">' + fm(q.A) + " 元/吨</span></div>" + stackChart(byCat(rows), s.g) + "</div>";
  }).join("");
  $("#main").innerHTML = h + card("各材质成本构成（φ175/φ150 示例，元/吨）", mats) +
    '<div class="legend">' + Object.keys(CATCOL).map(function (k) { return '<span><b style="background:' + CATCOL[k] + '"></b>' + k + "</span>"; }).join("") + "</div>";
}

/* 分类色 + 堆叠图 */
var CATCOL = {
  "金属消耗": "#8C6A2F", "原料成本": "#4A5B68", "天燃气": "#C3703A", "水": "#3F7C8A", "电": "#D9A62E",
  "辅材": "#7C6E9B", "模具": "#A85C4E", "环保费": "#4C8A5F", "人工": "#2E7D6B", "折旧": "#5A6469", "品质损失": "#9C8B6A", "运输": "#6B7A8F"
};
function byCat(rows) {
  var m = {};
  rows.forEach(function (r) { m[r.p] = (m[r.p] || 0) + r.amt; });
  return Object.keys(m).map(function (k) { return { k: k, v: m[k] }; }).sort(function (a, b) { return b.v - a.v; });
}
function stackChart(cats, total) {
  var tot = total || cats.reduce(function (a, b) { return a + b.v; }, 0), h = '<div class="stack">';
  cats.forEach(function (c) {
    var w = tot ? Math.max(0, c.v / tot * 100) : 0;
    h += '<div class="srow"><div class="nm">' + esc(c.k) + '</div><div class="tr"><i style="width:' + w.toFixed(2) + '%;background:' + (CATCOL[c.k] || "#9AA6AE") + '"></i></div><div class="vv mono">' + fm(c.v) + "</div></div>";
  });
  h += "</div>";
  h += '<div class="legend">' + cats.map(function (c) { return '<span><b style="background:' + (CATCOL[c.k] || "#9AA6AE") + '"></b>' + esc(c.k) + " " + (tot ? (c.v / tot * 100).toFixed(1) : 0) + "%</span>"; }).join("") + "</div>";
  return h;
}

/* ---------------- 渲染入口 ---------------- */
var RENDER = { db: pageDB, main: pageMain, proc: pageProc, route: pageRoute, glob: pageGlob, dev: pageDev, eff: pageEff, cut: pageCut, plate: pagePlate, cyl: pageCyl, sum: pageSum, chart: pageChart };
function render() {
  if (!RENDER[PAGE]) PAGE = "db";
  $$("#nav a").forEach(function (a) { a.classList.toggle("on", a.dataset.p === PAGE); });
  $$("#modeSw button").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === MODE); });
  try { RENDER[PAGE](); }
  catch (e) {
    $("#main").innerHTML = '<div class="card"><div class="hd">⚠ 页面渲染出错（' + esc(PAGE) + '）</div><div class="bd"><pre style="white-space:pre-wrap;font-size:12.5px;color:#B03A2E">' + esc(String(e && e.stack ? e.stack : e)) + '</pre></div></div>';
  }
}
document.addEventListener("DOMContentLoaded", function () {
  if (location.hash && RENDER[location.hash.slice(1)]) PAGE = location.hash.slice(1);
  boot();
});






</script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
